name: Security Re-scan

# One-click / automatic security re-scan.
#   • runs after every deployment (deployment_status → success)
#   • runs on every push to main
#   • can be launched manually from the Actions tab ("Run workflow")
#   • runs nightly so a newly published CVE is caught without a deploy
on:
  deployment_status:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  scan:
    # Skip the in-flight/failed deployment events; only scan what actually shipped.
    if: ${{ github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ensure pgtap extension available
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Run security scan
        run: bash scripts/security-scan.sh

      - name: Summary
        if: always()
        run: echo "Security re-scan finished for ${{ github.sha }} — see the step logs above." >> $GITHUB_STEP_SUMMARY
