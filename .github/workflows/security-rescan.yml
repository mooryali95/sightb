name: Security Re-scan

# One-click / automatic security re-scan.
#   • runs after every deployment (deployment_status → success)
#   • runs on every push to main
#   • can be launched manually from the Actions tab ("Run workflow")
#   • runs nightly so a newly published CVE is caught without a deploy
on:
  deployment_status:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  scan:
    # Skip the in-flight/failed deployment events; only scan what actually shipped.
    if: ${{ github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # No `CREATE EXTENSION pgtap` here any more: this workflow no longer runs
      # the pgTAP suite (it needs seeded fixtures and belongs to SSOT Tests —
      # see scripts/security-scan.sh). Dropping it also removes the last write
      # this job made, so the scan is now purely read-only and cannot contend
      # with the seeding job for anything.
      - name: Run security scan
        run: bash scripts/security-scan.sh

      # Needs no secret, so it runs on Lovable Cloud where the database checks
      # above cannot: every table a migration creates and every function in
      # the repository must answer on the live project. Red here means
      # something merged through git is not live yet. See the script.
      - name: Live drift against the public API
        run: bash scripts/live-drift.sh

      - name: Summary
        if: always()
        run: echo "Security re-scan finished for ${{ github.sha }} — see the step logs above." >> $GITHUB_STEP_SUMMARY
