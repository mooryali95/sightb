name: Quality

on:
  push:
    branches: [main]
  # No branch filter: a pull request gets checked whatever it targets. Pinning
  # this to [main] meant work stacked on a feature branch went unverified until
  # it was retargeted.
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Unit tests (finance / funds / SSOT math)
        run: bun run test

      - name: "Strict typecheck (whole app — tsconfig.app.json sets strict: true)"
        run: bun run typecheck:strict

      - name: Production build
        run: bun run build

      # The heavy chunks (charts, PDF, spreadsheets) must load only when a page
      # needs them, never before sign-in. See the script for how they once did.
      - name: Guard what loads before sign-in
        run: bash scripts/initial-load-guard.sh

      - name: Lint (ratchet — the count may fall, never rise)
        run: |
          # These counts predate lint being gated at all; see P1-05 in
          # docs/production-readiness-2026-08.md. Clearing them in one pass would
          # be a huge, unreviewable diff, so the budgets below hold the line
          # instead: new code cannot add violations, and every batch you clear
          # should be paid forward by lowering the budget in the same PR.
          #
          # Warnings are capped too, not just errors. react-hooks/exhaustive-deps
          # reports at warning severity, and those are the violations with actual
          # runtime consequences — a stale dependency array shows a stale balance.
          # Counting only errors let the whole class through unnoticed.
          # Ratchet log — lower these, never raise them:
          #   398 → 375 (14 Aug): cleared every non-`any` rule class. What is
          #   left is 375 `no-explicit-any` and 10 `react-refresh` warnings,
          #   so the next batch is necessarily typing work, file by file.
          #   375 → 372 (23 Aug): main had been red for eight days — the cash
          #   -repair work pushed the count to 402. Typed the DB row shapes it
          #   introduced (cash_transfer_repairs, cash_transfers) and the test
          #   fixtures, which also surfaced a dead `userId` field and two casts
          #   that were never needed.
          #   336 → 301 (11 Sep): the payables section and everything under
          #   components/project/payables/ are now `any`-free. Twenty-four
          #   `catch (e: any)` blocks read `.message` off an unknown throw and
          #   showed an empty toast when it was not an Error; they go through
          #   lib/utils errorMessage() now. The rest were `(x: any) =>` filter
          #   annotations on lists whose element type the store already knew.
          #   301 → 290 (11 Sep): the funds section and everything under
          #   components/project/funds/ are `any`-free too, by the same two
          #   moves (errorMessage() in catch blocks, typed list callbacks).
          #   290 → 276 (12 Sep): the expenses section and everything under
          #   components/project/expenses/ are `any`-free; the section's
          #   `expenses: any[]` and `revenues: any[]` props are typed, and an
          #   edit that clears a link goes through a typed ExpenseUpdate
          #   instead of `as any`.
          #   276 → 262 (12 Sep): the custody section and everything under
          #   components/project/custody/ are `any`-free. The section's
          #   `expenses: any[]` prop is typed, and a custody edit clears its
          #   fund link or notes through a typed CustodyUpdate — the old
          #   signature intersected `string | undefined` with `string | null`,
          #   which narrows to `string`, so null only ever got through a cast.
          #   262 → 242 (12 Sep): the budget section and everything under
          #   components/project/budget/ are `any`-free; its three list props
          #   are typed and the `(x: any) =>` callbacks over them went with it.
          #   242 → 229 (12 Sep): the revenue section and everything under
          #   components/project/revenue/ are `any`-free; its `revenues: any[]`
          #   prop is typed Revenue[], and an edit that clears a milestone
          #   link or an invoice field goes through a typed RevenueUpdate.
          #   229 → 228 (12 Sep): getMonthlyBreakdown read the outstanding-advance
          #   flag through `as any`; the field is on the Expense type.
          #   228 → 225 (12 Sep): the mobile capture page and everything under
          #   pages/mobile/ are `any`-free; its two catch blocks go through
          #   errorMessage() and the expense payload needs no cast.
          #   225 → 210 (12 Sep): the vendor payables panel and everything under
          #   components/project/vendor/ are `any`-free; the store is read typed
          #   instead of through `useStore() as any`.
          #   210 → 153 (12 Sep): the tab badges, the three dashboard cards and
          #   the summary library read typed fields; their `any[]` props and
          #   `(x as any).field` reads were all on fields the types carry.
          #   153 → 149 (12 Sep): useProjectDetailData reads the store typed and
          #   takes a BudgetItem where it took `any`.
          #   149 → 133 (12 Sep): the baseline section, the smart notifications,
          #   the company management card and the amendment manager read typed
          #   fields; their catch blocks take `unknown`.
          #   133 → 104 (12 Sep): the budget slice reads its own store typed and
          #   names the optimistic insert row once; the finance, funds and
          #   payables-export tests build their fixtures through typed helpers.
          #   104 → 74 (12 Sep): the user service reads table rows typed, the audit
          #   pages name the JSON bag they render, the offline queue reads the
          #   client through a small structural interface, the fund service uses
          #   the typed client, and the window flags and catch blocks are typed.
          #   74 → 53 (12 Sep): the payables data layer returns the generated
          #   table rows and the slice maps them typed; the realtime mapper in
          #   the load slice types each table's row. One `as any` remains in
          #   resourcePayableService, disabled inline with its reason.
          #   53 → 26 (12 Sep): every leftover `any` outside two intended
          #   boundaries is gone (JSON bags named where they are rendered,
          #   catch blocks on `unknown`, row mappers on the generated table
          #   types). What remains: services/db.ts (12, the dynamic proxy around
          #   the client), lib/export.ts (12), and a Lovable-authored edge
          #   function (2).
          #   26 → 14 (12 Sep): the export library takes the real BudgetItem,
          #   Expense and Revenue shapes (so the finance library gets them
          #   uncast), names what jspdf-autotable adds to a document, and is one
          #   module per report under lib/export/.
          #   14 → 2 (12 Sep): the database wrapper's internals are typed (the
          #   query envelope, the replayed chain, the thenable) and its one
          #   deliberately loose surface, the fluent builder, is disabled inline
          #   with its reason. The two left are in a Lovable-authored edge
          #   function; see rule 3 in CLAUDE.md.
          #   2 / 10 → 0 / 3 (15 Sep): the Deno edge functions leave this
          #   config (they are not the browser bundle it describes, and the
          #   two `any` sat in a Lovable-authored shared helper, which now has
          #   unit tests under src/test/edge instead), and the vendored shadcn
          #   primitives keep every rule but the hot-reload one, which their
          #   variant helpers trip by design. The three warnings left are the
          #   same hot-reload rule on two Lovable-authored app files
          #   (auth/Can.tsx, hooks/useAuth.tsx); they stay counted.
          #   0 / 3 → 0 / 2 (23 Sep): the in-range dependency update brought a
          #   newer eslint-plugin-react-refresh, which no longer reports one of
          #   the two in Can.tsx. One is left in each file.
          ERROR_BUDGET=0
          WARN_BUDGET=2
          # Call eslint directly rather than through `bun run lint` — passing
          # `-f json` through a package script differs between bun and npm.
          bunx eslint . -f json > eslint-report.json || true
          read -r errors warnings <<< "$(node -e "
            const r = require('./eslint-report.json');
            const e = r.reduce((n, f) => n + f.errorCount, 0);
            const w = r.reduce((n, f) => n + f.warningCount, 0);
            console.log(e, w);
          ")"
          echo "ESLint: $errors errors (budget $ERROR_BUDGET), $warnings warnings (budget $WARN_BUDGET)"
          failed=0
          if [ "$errors" -gt "$ERROR_BUDGET" ]; then
            echo "::error::ESLint errors rose from $ERROR_BUDGET to $errors — new violations are not accepted."
            failed=1
          fi
          if [ "$warnings" -gt "$WARN_BUDGET" ]; then
            echo "::error::ESLint warnings rose from $WARN_BUDGET to $warnings — new violations are not accepted."
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            bun run lint || true
            exit 1
          fi
          if [ "$errors" -lt "$ERROR_BUDGET" ] || [ "$warnings" -lt "$WARN_BUDGET" ]; then
            echo "::notice::Down to $errors errors / $warnings warnings — lower the budgets in .github/workflows/quality.yml."
          fi

      - name: Guard the lockfile registry
        run: |
          # Every tarball must resolve from the public npm registry.
          #
          # bun.lock has twice arrived resolving packages from
          # <region>-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache — a private
          # Google Artifact Registry belonging to Lovable. 176 packages the first
          # time, four more on the next Lovable push, from a different region.
          # So this is not a one-off to clean up; it regenerates whenever the
          # lockfile is written by that toolchain, and needs a gate rather than
          # a fix.
          #
          # Integrity hashes mean this was never a tampering risk — bun rejects
          # altered content. The risk is availability: if that registry is retired
          # or closes public read, every CI install and every fresh clone breaks
          # on a URL nobody chose to depend on.
          #
          # The remedy is a plain substitution — swap the host for
          # registry.npmjs.org and keep the sha512 untouched; a successful
          # `bun install --frozen-lockfile` then proves the content is identical.
          private=$(grep -oE 'https://[a-z0-9.-]*pkg\.dev/[^"]*' bun.lock | sort -u || true)
          if [ -n "$private" ]; then
            echo "::error::bun.lock resolves packages from a private registry."
            echo "$private"
            echo
            echo "Fix: replace the host with https://registry.npmjs.org/ keeping each sha512,"
            echo "then run 'bun install --frozen-lockfile' to verify the hashes still match."
            exit 1
          fi
          echo "All lockfile tarballs resolve from the public npm registry."

      - name: Guard the migration history
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # An applied migration must never leave the repository: the live
          # ledger keeps its version, so `supabase db push` refuses to run, and
          # a database rebuilt from the repository lacks what it created.
          # Lovable deleted 20260314014847_email_infra.sql on 23 September while
          # three functions still used its table. See the script.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: no base to compare against."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          scripts/deleted-migrations.sh "$BASE" HEAD

      - name: Guard the data-access layer
        run: |
          # Production code must reach the database through src/services only.
          #
          # Match the import statement, not the bare path. A plain substring
          # search has produced two false positives already: `vi.mock(...)` in
          # offline-queue.test.ts, and a doc comment in main.tsx that merely
          # names the file. Neither issues a query; both blocked every PR.
          # Tests stay excluded as a second line of defence.
          violations=$(grep -rlE "(from|require\()[[:space:]]*['\"][^'\"]*integrations/supabase/client" src \
            --include='*.ts' --include='*.tsx' \
            | grep -v '/__tests__/' \
            | grep -v '^src/services/' \
            | grep -v '^src/integrations/' \
            | grep -v '^src/lib/offline-queue.ts$' \
            | grep -v '^src/hooks/useAuth.tsx$' \
            | grep -v '^src/pages/Login.tsx$' \
            | grep -v '^src/pages/ResetPassword.tsx$' || true)
          if [ -n "$violations" ]; then
            echo "Direct database-client imports outside the service layer:"
            echo "$violations"
            exit 1
          fi


  e2e:
    # Separate from `checks` so a browser download never delays the fast gates,
    # and so a failure here names itself rather than hiding inside a long job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        # Only chromium, and only its system deps: the other engines would
        # triple the install for coverage these three paths do not need.
        run: bunx playwright install --with-deps chromium

      - name: End-to-end paths (expense · settlement · export)
        # Supabase is stubbed at the network boundary, so this needs no
        # database secret and cannot silently skip — see the note at the head
        # of playwright.config.ts for what that does and does not cover.
        run: bun run test:e2e
        env:
          VITE_SUPABASE_URL: https://e2e.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-publishable-key

      - name: Upload the trace when a path fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
