name: SSOT Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ssot:
    runs-on: ubuntu-latest
    # Requires two repo secrets:
    #   SUPABASE_DB_URL  — postgres URI to a *test* Supabase branch
    #   SSOT_OWNER_UID   — uuid of an existing auth.users row in that branch
    if: ${{ secrets.SUPABASE_DB_URL != '' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SSOT_OWNER_UID:  ${{ secrets.SSOT_OWNER_UID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Ensure pgtap extension available
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Run SSOT tests
        run: bash scripts/run-ssot-tests.sh
